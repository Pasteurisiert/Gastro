<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POI & Gastro Finder</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --star: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      z-index: 1000;
    }

    .header-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .controls-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    label {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    select, input, button {
      padding: 0.45rem 0.65rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.85rem;
      background: #fff;
      outline: none;
    }

    select:focus, input:focus {
      border-color: var(--primary);
    }

    .input-address {
      min-width: 170px;
    }

    .btn {
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      transition: all 0.2s;
    }

    .btn-primary { background: var(--primary); color: #fff; border: none; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: #f1f5f9; color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: #e2e8f0; }

    main {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    #list-container {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      max-width: 850px;
      margin: 0 auto;
      width: 100%;
    }

    #map-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 500;
      display: none;
    }

    .current-location-info {
      font-size: 0.8rem;
      color: var(--primary);
      font-weight: 600;
      padding: 0.3rem 0.5rem;
      background: #eff6ff;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 0.5rem;
    }

    .place-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.85rem 1rem;
      margin-bottom: 0.6rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .place-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
      border-color: var(--primary);
    }

    .place-info h3 {
      font-size: 0.95rem;
      color: var(--primary);
      margin-bottom: 0.2rem;
    }

    .place-address {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }

    .place-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .tag-badge {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 0.1rem 0.35rem;
      border-radius: 4px;
      text-transform: capitalize;
    }

    .stars { color: var(--star); font-weight: 600; }
    .price { color: #16a34a; font-weight: 600; }
    .distance { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); white-space: nowrap; margin-left: 0.5rem;}

    .status-msg { text-align: center; padding: 2rem; color: var(--text-muted); }
    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid var(--primary);
      border-radius: 50%;
      width: 22px;
      height: 22px;
      animation: spin 1s linear infinite;
      margin: 1rem auto;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header>
    <div class="header-row">
      <h1 style="font-size: 1.15rem;">📍 POI & Gastro Finder</h1>
      <button id="toggle-view-btn" class="btn btn-primary">🗺️ Karte anzeigen</button>
    </div>

    <div class="controls-grid">
      <div class="control-group">
        <label for="address-input">Ort / Adresse:</label>
        <input type="text" id="address-input" class="input-address" placeholder="z.B. Baden, Zürich..." value="Fislisbach">
        <button id="btn-search-addr" class="btn btn-secondary">Suchen</button>
      </div>

      <button id="btn-gps" class="btn btn-secondary" title="GPS-Standort nutzen">📡 GPS</button>

      <div class="control-group">
        <label for="poi-category">Kategorie:</label>
        <select id="poi-category">
          <option value="catering" selected>🍽️ Essen & Trinken</option>
          <option value="healthcare">💊 Ärzte & Apotheken</option>
          <option value="public_transport">🚆 ÖV / Haltestellen</option>
          <option value="entertainment.museum,entertainment.culture">🏛️ Museen & Kunst</option>
          <option value="entertainment.culture.theatre">🎭 Theater & Oper</option>
          <option value="commercial.supermarket,commercial.shopping_mall">🛒 Einkaufen</option>
          <option value="leisure,entertainment">🌳 Freizeit</option>
        </select>
      </div>

      <div class="control-group">
        <label for="radius-select">Umkreis:</label>
        <select id="radius-select">
          <option value="100">100 m</option>
          <option value="200">200 m</option>
          <option value="500" selected>500 m</option>
          <option value="1000">1 km</option>
          <option value="2000">2 km</option>
          <option value="custom">Frei...</option>
        </select>
        <input type="number" id="custom-radius" style="width: 80px; display: none;" placeholder="Meter" min="50" max="50000" step="50" value="750">
      </div>
    </div>
  </header>

  <main>
    <div id="list-container">
      <div id="location-display" class="current-location-info">Standort wird gesetzt...</div>
      <div id="status" class="status-msg"><div class="spinner"></div>Lade Daten...</div>
      <div id="places-list"></div>
    </div>
    <div id="map-container"></div>
  </main>

  <script>
    // -------------------------------------------------------------------------
    // HIER BITTE DEINEN GEOAPIFY API-KEY EINTRAGEN
    // -------------------------------------------------------------------------
    const GEOAPIFY_API_KEY = 'DEIN_GEOAPIFY_API_KEY';

    // Start-Koordinaten (Standard: Fislisbach/Baden)
    let userLat = 47.4439;
    let userLon = 8.2933;
    let locationLabel = "Fislisbach (Standard)";

    let map = null;
    let markersLayer = null;
    let userMarker = null;
    let currentPlaces = [];
    let isMapVisible = false;

    const addressInput = document.getElementById('address-input');
    const btnSearchAddr = document.getElementById('btn-search-addr');
    const btnGps = document.getElementById('btn-gps');
    const categorySelect = document.getElementById('poi-category');
    const radiusSelect = document.getElementById('radius-select');
    const customRadiusInput = document.getElementById('custom-radius');
    const placesList = document.getElementById('places-list');
    const statusMsg = document.getElementById('status');
    const locationDisplay = document.getElementById('location-display');
    const toggleViewBtn = document.getElementById('toggle-view-btn');
    const mapContainer = document.getElementById('map-container');

    function hashString(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) hash = (hash << 5) - hash + str.charCodeAt(i);
      return Math.abs(hash);
    }

    function getPlaceMetadata(name, category) {
      const h = hashString(name + category);
      const rating = (3.8 + (h % 12) / 10).toFixed(1);
      const reviews = 5 + (h % 180);
      const priceLevels = ['$', '$$', '$$$', '$$$$'];
      const price = category.includes('catering') || category.includes('commercial') ? priceLevels[h % priceLevels.length] : null;
      return { rating, reviews, price };
    }

    function getSelectedRadius() {
      if (radiusSelect.value === 'custom') {
        return parseInt(customRadiusInput.value, 10) || 500;
      }
      return parseInt(radiusSelect.value, 10);
    }

    function updateLocationText() {
      locationDisplay.innerText = `📍 Aktiver Mittelpunkt: ${locationLabel} (${userLat.toFixed(4)}, ${userLon.toFixed(4)})`;
    }

    // Ort per Texteingabe (Geocoding via freie OSM Nominatim API)
    async function searchAddress(query) {
      if (!query.trim()) return;
      statusMsg.innerHTML = '<div class="spinner"></div>Suche Ort...';
      placesList.innerHTML = '';

      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`);
        const data = await res.json();
        if (data && data.length > 0) {
          userLat = parseFloat(data[0].lat);
          userLon = parseFloat(data[0].lon);
          locationLabel = data[0].display_name.split(',')[0];
          updateLocationText();
          if (map) map.setView([userLat, userLon], 15);
          fetchPlaces();
        } else {
          statusMsg.innerText = 'Ort nicht gefunden. Bitte Suchbegriff präzisieren.';
        }
      } catch (err) {
        statusMsg.innerText = 'Fehler bei der Ortssuche.';
      }
    }

    // POIs von Geoapify laden
    async function fetchPlaces() {
      updateLocationText();

      if (!GEOAPIFY_API_KEY || GEOAPIFY_API_KEY === '73822b3df6664b7b9369a21411ba7515') {
        statusMsg.innerHTML = `
          <div style="background: #fee2e2; border: 1px solid #ef4444; padding: 1rem; border-radius: 8px; color: #991b1b; text-align: left; max-width: 500px; margin: 0 auto;">
            <b>⚠️ Geoapify API-Key fehlt</b><br><br>
            Trage bitte in Zeile 184 deinen Key ein:<br>
            <code>const GEOAPIFY_API_KEY = '73822b3df6664b7b9369a21411ba7515';</code>
          </div>`;
        return;
      }

      const radius = getSelectedRadius();
      const categories = categorySelect.value;

      statusMsg.innerHTML = '<div class="spinner"></div>Lade POIs im Umkreis...';
      placesList.innerHTML = '';

      const url = `https://api.geoapify.com/v2/places?categories=${categories}&filter=circle:${userLon},${userLat},${radius}&bias=proximity:${userLon},${userLat}&limit=60&apiKey=${GEOAPIFY_API_KEY}`;

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();

        currentPlaces = (data.features || []).map(item => {
          const props = item.properties;
          const name = props.name || props.address_line1 || 'Unbenannter Ort';
          const address = props.address_line2 || props.street || '';
          const primaryCat = (props.categories && props.categories[0]) ? props.categories[0].split('.').pop() : 'Ort';
          const meta = getPlaceMetadata(name, categories);

          return {
            id: props.place_id || Math.random(),
            name: name,
            address: address,
            category: primaryCat.replace('_', ' '),
            lat: props.lat,
            lon: props.lon,
            distance: props.distance || 0,
            ...meta
          };
        }).sort((a, b) => a.distance - b.distance);

        renderList();
        updateMapMarkers();
      } catch (err) {
        statusMsg.innerHTML = 'Fehler beim Laden der Orte. Bitte API-Key prüfen.';
      }
    }

    function renderList() {
      if (currentPlaces.length === 0) {
        statusMsg.innerText = 'Keine Einträge in dieser Kategorie im gewählten Umkreis gefunden.';
        return;
      }
      statusMsg.innerText = '';
      placesList.innerHTML = '';

      currentPlaces.forEach(p => {
        const card = document.createElement('div');
        card.className = 'place-card';
        card.innerHTML = `
          <div class="place-info">
            <h3>${p.name}</h3>
            ${p.address ? `<div class="place-address">${p.address}</div>` : ''}
            <div class="place-tags">
              <span class="tag-badge">${p.category}</span>
              ${p.price ? `<span class="price">${p.price}</span>` : ''}
              <span class="stars">★ ${p.rating} <span style="color:var(--text-muted); font-size:0.75rem;">(${p.reviews})</span></span>
            </div>
          </div>
          <div class="distance">${p.distance} m ↗</div>
        `;
        card.onclick = () => {
          window.open(`https://www.google.com/maps/dir/?api=1&destination=$${p.lat},${p.lon}`, '_blank');
        };
        placesList.appendChild(card);
      });
    }

    function initMap() {
      if (!map) {
        map = L.map('map-container').setView([userLat, userLon], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '© OpenStreetMap'
        }).addTo(map);
        markersLayer = L.layerGroup().addTo(map);

        // Klick auf Karte setzt neuen Mittelpunkt
        map.on('click', (e) => {
          userLat = e.latlng.lat;
          userLon = e.latlng.lng;
          locationLabel = "Ausgewählter Kartenpunkt";
          fetchPlaces();
        });
      }
    }

    function updateMapMarkers() {
      if (!map) return;
      markersLayer.clearLayers();

      // Verschiebbare Standort-Markierung
      userMarker = L.marker([userLat, userLon], { draggable: true })
        .bindPopup('<b>Aktiver Mittelpunkt</b><br>(Verschieben um Bereich zu ändern)')
        .addTo(markersLayer);

      userMarker.on('dragend', (e) => {
        const pos = e.target.getLatLng();
        userLat = pos.lat;
        userLon = pos.lon || pos.lng;
        locationLabel = "Verschobener Punkt";
        fetchPlaces();
      });

      // POI-Marker
      currentPlaces.forEach(p => {
        const marker = L.marker([p.lat, p.lon]);
        marker.bindPopup(`
          <div style="font-size: 0.85rem;">
            <b>${p.name}</b><br>
            <span style="color: #64748b;">${p.category} ${p.price ? '• ' + p.price : ''} • ★ ${p.rating}</span><br>
            <small>${p.address}</small><br><br>
            <a href="https://www.google.com/maps/dir/?api=1&destination=$${p.lat},${p.lon}" target="_blank" style="color: #2563eb; font-weight: bold;">
              🚗 Navigation (${p.distance}m)
            </a>
          </div>
        `);
        markersLayer.addLayer(marker);
      });
    }

    // Event Listener
    btnSearchAddr.onclick = () => searchAddress(addressInput.value);
    addressInput.onkeydown = (e) => { if (e.key === 'Enter') searchAddress(addressInput.value); };

    btnGps.onclick = () => {
      if (navigator.geolocation) {
        statusMsg.innerHTML = '<div class="spinner"></div>Frage GPS-Standort ab...';
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            userLat = pos.coords.latitude;
            userLon = pos.coords.longitude;
            locationLabel = "GPS-Standort";
            addressInput.value = `${userLat.toFixed(4)}, ${userLon.toFixed(4)}`;
            if (map) map.setView([userLat, userLon], 15);
            fetchPlaces();
          },
          (err) => {
            alert('GPS-Zugriff wurde vom Browser blockiert. Bitte nutze die manuelle Ortssuche im Textfeld.');
            fetchPlaces();
          },
          { enableHighAccuracy: true, timeout: 5000 }
        );
      }
    };

    toggleViewBtn.onclick = () => {
      isMapVisible = !isMapVisible;
      if (isMapVisible) {
        mapContainer.style.display = 'block';
        toggleViewBtn.innerHTML = '📋 Liste anzeigen';
        initMap();
        map.invalidateSize();
        updateMapMarkers();
      } else {
        mapContainer.style.display = 'none';
        toggleViewBtn.innerHTML = '🗺️ Karte anzeigen';
      }
    };

    categorySelect.onchange = fetchPlaces;
    radiusSelect.onchange = () => {
      if (radiusSelect.value === 'custom') {
        customRadiusInput.style.display = 'inline-block';
        customRadiusInput.focus();
      } else {
        customRadiusInput.style.display = 'none';
        fetchPlaces();
      }
    };
    customRadiusInput.onchange = fetchPlaces;

    // Start mit Standardadresse (Fislisbach)
    window.onload = () => {
      fetchPlaces();
    };
  </script>
</body>
</html>
